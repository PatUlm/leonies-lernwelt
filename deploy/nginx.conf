# http context (this file is included inside http {}): nginx runs as user 101
# and cannot write the default temp paths under /var/cache/nginx.
proxy_temp_path /tmp/proxy_temp;
client_body_temp_path /tmp/client_temp;
fastcgi_temp_path /tmp/fastcgi_temp;
uwsgi_temp_path /tmp/uwsgi_temp;
scgi_temp_path /tmp/scgi_temp;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # No access log: client IP addresses are not stored (see datenschutz.html).
    access_log off;

    # Vite emits content-hashed file names under assets/.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # PWA manifest; nginx's default MIME table does not know .webmanifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        default_type application/json;
        add_header Cache-Control "no-store";
        try_files /healthz.json =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
